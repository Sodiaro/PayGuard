name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: payguard
          POSTGRES_PASSWORD: payguard-ci
          POSTGRES_DB: payguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payguard -d payguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://payguard:payguard-ci@localhost:5432/payguard_test
      TEST_DATABASE_URL: postgresql://payguard:payguard-ci@localhost:5432/payguard_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (also generates the Prisma client)
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Unit tests
        run: npm test

      - name: Apply migrations to the test database
        run: npm run db:migrate:deploy

      - name: Check migrations match the Prisma schema
        run: npm run db:migrate:check

      - name: Integration tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker:
    name: Docker images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The smoke script uses Node only to generate throwaway credentials and read JSON.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Builds the images and runs the Compose stack (fresh database, migrations, API, standalone
      # worker) with generated credentials, then removes it, also on failure.
      - name: Build and smoke-test the Compose stack
        run: npm run smoke:docker
