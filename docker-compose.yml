name: payguard

# Credentials have no defaults: a missing .env fails loudly instead of using a guessable password.
# Each process connects as its own role (see the README on database roles); nothing but role
# provisioning ever connects as the POSTGRES_USER superuser.
x-runtime-database-url: &runtime-database-url postgresql://payguard_app:${PAYGUARD_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
x-operator-database-url: &operator-database-url postgresql://payguard_cli:${PAYGUARD_CLI_PASSWORD}@postgres:5432/${POSTGRES_DB}
x-migration-database-url: &migration-database-url postgresql://payguard_owner:${PAYGUARD_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}

# Settings shared by the API, the worker and the CLI. The payment simulator is the only provider
# and is refused under NODE_ENV=production, so this stack runs hardened containers in development
# mode: a local, production-like demonstration with simulated payments, not a deployment.
x-core-environment: &core-environment
  NODE_ENV: development
  PAYMENT_SIMULATOR_OUTCOME: ${PAYMENT_SIMULATOR_OUTCOME:-SUCCEEDED}
  PAYMENT_SIMULATOR_AMBIGUOUS_SUBMISSIONS: ${PAYMENT_SIMULATOR_AMBIGUOUS_SUBMISSIONS:-false}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
  OUTBOX_MAX_RUNS: ${OUTBOX_MAX_RUNS:-10}
  OUTBOX_BACKOFF_MAX_SECONDS: ${OUTBOX_BACKOFF_MAX_SECONDS:-300}
  RECONCILIATION_DELAY_SECONDS: ${RECONCILIATION_DELAY_SECONDS:-60}

# The application never writes to its filesystem and needs no Linux capabilities.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  # Long enough for the batch in flight to finish: provider calls time out after 10 s.
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # Read only by the init script that provisions the roles, on first start of the volume.
      PAYGUARD_OWNER_PASSWORD: ${PAYGUARD_OWNER_PASSWORD:?Set PAYGUARD_OWNER_PASSWORD in .env}
      PAYGUARD_APP_PASSWORD: ${PAYGUARD_APP_PASSWORD:?Set PAYGUARD_APP_PASSWORD in .env}
      PAYGUARD_CLI_PASSWORD: ${PAYGUARD_CLI_PASSWORD:?Set PAYGUARD_CLI_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images store data in /var/lib/postgresql/<major>, not .../data.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      MIGRATION_DATABASE_URL: *migration-database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: .
      target: runtime
    environment:
      <<: *core-environment
      DATABASE_URL: *runtime-database-url
      PAYMENT_PROVIDER: simulator
      PORT: 3000
      # Processing runs in the worker service below.
      OUTBOX_WORKER_ENABLED: 'false'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-300}
      RATE_LIMIT_PAYMENT_CREATES_PER_MINUTE: ${RATE_LIMIT_PAYMENT_CREATES_PER_MINUTE:-60}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      HEALTH_QUEUE_BACKLOG_SECONDS: ${HEALTH_QUEUE_BACKLOG_SECONDS:-120}
      HEALTH_WORKER_TIMEOUT_SECONDS: ${HEALTH_WORKER_TIMEOUT_SECONDS:-30}
      # Unset or empty: the webhook endpoint answers 503.
      SIMULATOR_WEBHOOK_SECRET: ${SIMULATOR_WEBHOOK_SECRET:-}
      WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: ${WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *hardening
    build:
      context: .
      target: runtime
    command: ['node', 'dist/worker.js']
    environment:
      <<: *core-environment
      DATABASE_URL: *runtime-database-url
      PAYMENT_PROVIDER: simulator
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The operator CLI, with the operator role's credentials, which the API and worker never hold:
  #   docker compose run --rm cli merchant:create --name "Acme Ltd"
  cli:
    <<: *hardening
    restart: 'no'
    profiles: ['tools']
    build:
      context: .
      target: runtime
    entrypoint: ['node', 'dist/cli/admin.js']
    environment:
      <<: *core-environment
      OPERATOR_DATABASE_URL: *operator-database-url
      SIMULATOR_WEBHOOK_SECRET: ${SIMULATOR_WEBHOOK_SECRET:-}
      PAYGUARD_OPERATOR: ${PAYGUARD_OPERATOR:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
